[package]
name = "taskbar-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "GTK4/libadwaita settings app for the taskbar tray"
rust-version.workspace = true

[[bin]]
name = "taskbar-settings"
path = "src/main.rs"

[dependencies]
taskbar-core.workspace = true
taskbar-api.workspace = true
anyhow.workspace = true
async-channel = "2"
futures-util.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zbus.workspace = true

[dependencies.gtk]
workspace = true
features = ["v4_12"]

[dependencies.adw]
workspace = true
features = ["v1_5"]
