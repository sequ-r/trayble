[workspace]
resolver = "2"
members = [
    "crates/taskbar-core",
    "crates/taskbar-api",
    "crates/taskbar-daemon",
    "crates/taskbar-app",
    "crates/taskbar-testitem",
]

[workspace.package]
version = "0.1.8"
edition = "2021"
license = "GPL-3.0-or-later"
description = "A system tray (StatusNotifierItem) for the GNOME panel"
repository = "https://github.com/sequ-r/trayble"
homepage = "https://github.com/sequ-r/trayble"
rust-version = "1.85"

[workspace.dependencies]
taskbar-core = { path = "crates/taskbar-core" }
taskbar-api = { path = "crates/taskbar-api" }

serde = { version = "1", features = ["derive"] }
toml = "0.8"
zbus = { version = "5", default-features = false, features = ["tokio"] }
zvariant = "5"
# gtk-rs convention: the crates are `gtk4` and `libadwaita`, the idiomatic
# import names are `gtk` and `adw`.
gtk = { package = "gtk4", version = "0.11" }
adw = { package = "libadwaita", version = "0.9" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
thiserror = "2"

[profile.release]
lto = "thin"
strip = true
